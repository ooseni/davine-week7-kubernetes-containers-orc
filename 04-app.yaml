apiVersion: apps/v1
kind: Deployment
metadata:
  name: davine-webapp
  namespace: davine-space
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-frontend
  template:
    metadata:
      labels:
        app: nginx-frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.21.0
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: web-config

---

apiVersion: v1
kind: Service
metadata:
  name: davine-webapp-service
  namespace: davine-space
spec:
  type: NodePort
  selector:
    app: nginx-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080